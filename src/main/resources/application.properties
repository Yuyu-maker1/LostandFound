spring.application.name=LostandFound
# 服务器配置
server.port=8083
#后端端口8083
# 数据源配置
spring.datasource.name=lostandfound
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#高版本 Mysql （8.0以上）驱动时，配置的 driver-class-name 需要加cj，url 后面必须设置时区 serverTimezone
spring.datasource.url=jdbc:mysql://localhost:3306/lostandfound?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=GMT
spring.datasource.username=root
spring.datasource.password=123456

# 连接池配置,hikari连接池是目前公认性能最高的数据库连接池
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.minimum-idle=5 
#启动服务不做任何请求时数据库与服务的连接数为5，且状态都为sleep
spring.datasource.hikari.maximum-pool-size=15
#数据库连接数上限为15，当请求超过最大连接数时，进入等待队列，直到有空闲的连接
spring.datasource.hikari.connection-timeout=30000
#当等待队列中的线程等待时间超过30s则开始报错
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.idle-timeout=30000

#mybatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
